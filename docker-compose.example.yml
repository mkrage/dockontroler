# Example deployment. There is nothing to build — the image is published to the
# GitHub Container Registry, so this file stands on its own:
#
#   docker compose up -d         # or paste this file into a Portainer stack
#
# Read the security section of the README before exposing this anywhere. There is
# no login: whoever can open the page can start, stop and replace every container
# on this host.

services:
  dockontroler:
    # A published image rather than "build: ." on purpose: Portainer's stack
    # editor has no build context, so a build there would fail. This one is built
    # and pushed by .github/workflows/build.yml on every push to main, as a single
    # multi-arch manifest — docker picks amd64 or arm64 for the host doing the
    # pull, so a Raspberry Pi needs nothing special here.
    #
    # Portainer's "Pull latest image" can stay on with this tag. Pin a version
    # instead (ghcr.io/mkrage/dockontroler:1.2.3) if you would rather decide
    # yourself when to move.
    #
    # For an image you built yourself this becomes plain "dockontroler:latest",
    # the tag ./rebuild.sh writes — and then the pull toggle has to be off, since
    # that tag exists only on that one host.
    image: ghcr.io/mkrage/dockontroler:latest
    container_name: dockontroler
    restart: unless-stopped

    ports:
      # CHANGE THIS to your server's LAN address. Binding to 0.0.0.0 (the plain
      # "3625:3625" form) publishes an unauthenticated control panel on every
      # interface, including any you did not think about.
      - "192.168.1.10:3625:3625"

    volumes:
      # The Docker socket. This is the whole reason the tool works, and also the
      # reason it is dangerous: access to this socket is equivalent to root on the
      # host.
      #
      # The :ro is worth having — it stops the file itself from being replaced —
      # but be clear that it does NOT restrict what dockontroler can ask Docker to
      # do. A read-only bind mount cannot make a socket read-only. If you want
      # real restrictions, put a socket proxy in front; see the README.
      - /var/run/docker.sock:/var/run/docker.sock:ro

    # Nothing is ever written to disk: configuration comes from the environment
    # and templates are compiled into the binary.
    read_only: true

    security_opt:
      - no-new-privileges:true

    # No healthcheck on purpose: the image is distroless, so there is no shell,
    # curl or wget inside for one to run. There is a GET /healthz endpoint — point
    # an external monitor at it. See the README.

    environment:
      # All of these are optional; the defaults are shown. LOG_LEVEL is the one
      # left active, set to its own default, because a key with nothing but
      # comments under it is YAML null, and compose rejects that with
      # "environment must be a mapping" instead of reading it as "empty".
      LOG_LEVEL: "info"

      # LISTEN_ADDR: ":3625"
      # DOCKER_SOCKET: "/var/run/docker.sock"
      # REFRESH_INTERVAL: "5s"
      # STOP_TIMEOUT: "10s"

      # Telegram bot. Leave the token unset to run without it.
      #
      # TELEGRAM_ALLOWED_CHAT_IDS is mandatory as soon as a token is set, and
      # startup fails without it: a bot with no allow-list hands every container on
      # this host to whoever finds it. Message the bot once and it replies with
      # the chat id to put here.
      # TELEGRAM_BOT_TOKEN: "123456789:AAExampleTokenFromBotFather"
      # TELEGRAM_ALLOWED_CHAT_IDS: "123456789"

      # Only needed if the log says dockontroler could not identify its own
      # container. Without it, nothing stops you from stopping the UI itself.
      # DOCKONTROLER_SELF_ID: "dockontroler"

# ---------------------------------------------------------------------------
# Hardening option: put a socket proxy in front of the daemon.
#
# The proxy exposes only the endpoints dockontroler needs, so a flaw in this tool
# — or anyone who reaches its unauthenticated page — cannot use the socket to do
# arbitrary things to the host.
#
# It needs a TCP endpoint though, and dockontroler currently speaks only to a unix
# socket. Until that changes this is documentation of intent rather than a working
# recipe; see the "Not in v1" section of the README.
#
#   docker-socket-proxy:
#     image: tecnativa/docker-socket-proxy
#     restart: unless-stopped
#     volumes:
#       - /var/run/docker.sock:/var/run/docker.sock:ro
#     environment:
#       CONTAINERS: 1      # list and inspect
#       POST: 1            # start, stop, restart, update, create
#       NETWORKS: 1        # attach a replacement to its networks
