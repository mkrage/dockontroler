<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="64" height="64"
     role="img" aria-label="docKontroler">
	<title>docKontroler</title>

	<defs>
		<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="120" y2="120">
			<stop stop-color="#0E7C8C" offset="0"/>
			<stop stop-color="#22A6BB" offset="1"/>
		</linearGradient>
	</defs>

	<rect width="120" height="120" rx="28" fill="url(#g)"/>

	<!-- Deliberately chunkier than the large mark, and without its pivot hole: at 16
	     pixels the hole turns into a smudge and thinner arms into hairlines. -->
	<rect x="27" y="24" width="17" height="72" rx="8.5" fill="#F6FBFC"/>
	<path fill="none" stroke="#F6FBFC" stroke-opacity="0.34" stroke-width="17"
	      stroke-linecap="round" d="M44 64l21 23.5"/>
	<path fill="none" stroke="#FFAB1F" stroke-width="17" stroke-linecap="round"
	      d="M52 55l36-23"/>
</svg>
