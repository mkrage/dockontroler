<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="doCKontroler">
	<title>doCKontroler</title>

	<defs>
		<linearGradient id="g" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="64" y2="64">
			<stop stop-color="#0E7C8C" offset="0"/>
			<stop stop-color="#22A6BB" offset="1"/>
		</linearGradient>
	</defs>

	<!-- Deliberately chunkier than the large mark: at 16 pixels a proportionally
	     scaled switch turns into a grey smudge. -->
	<rect width="64" height="64" rx="15" fill="url(#g)"/>
	<rect x="13" y="21" width="38" height="22" rx="11" fill="#FFFFFF"/>
	<circle cx="40" cy="32" r="7" fill="url(#g)"/>
</svg>
