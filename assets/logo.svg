<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 120" width="560" height="120"
     role="img" aria-label="doCKontroler">
	<title>doCKontroler</title>
	<desc>A toggle switch in a rounded badge, followed by the wordmark. "doCK" and
	"er" are heavy and carry the brand gradient so they read as Docker; "ontrol"
	sits between them in a lighter weight and a warm accent, so Control reads as
	nested inside it.</desc>

	<defs>
		<!-- userSpaceOnUse so the badge and the cut-out knob sample the same
		     gradient: the knob then blends with what is behind it and reads as a
		     hole rather than a separate shape. -->
		<linearGradient id="markGradient" gradientUnits="userSpaceOnUse"
		                x1="0" y1="8" x2="104" y2="112">
			<stop class="g-from" offset="0"/>
			<stop class="g-to" offset="1"/>
		</linearGradient>

		<!-- Spans the whole wordmark, so the two outer letter groups continue one
		     sweep instead of each restarting the gradient. -->
		<linearGradient id="wordGradient" gradientUnits="userSpaceOnUse"
		                x1="128" y1="36" x2="520" y2="92">
			<stop class="g-from" offset="0"/>
			<stop class="g-to" offset="1"/>
		</linearGradient>
	</defs>

	<style>
		.g-from { stop-color: #0E7C8C; }
		.g-to   { stop-color: #22A6BB; }
		.inner  { fill: #EA6E1B; }
		.knob   { fill: #FFFFFF; }

		@media (prefers-color-scheme: dark) {
			.g-from { stop-color: #2FB8CE; }
			.g-to   { stop-color: #67E8F9; }
			.inner  { fill: #FB923C; }
		}

		.word {
			font-family: "Inter", "Inter Tight", "SF Pro Display",
			             "Segoe UI Variable Display", "Segoe UI", Roboto,
			             "Helvetica Neue", Arial, sans-serif;
			font-size: 58px;
			letter-spacing: -0.02em;
		}
		.outer { font-weight: 800; fill: url(#wordGradient); }
		.inner { font-weight: 600; }
	</style>

	<!-- The mark: a switch that is on. It says "control" without a metaphor to
	     decode, and it survives being shrunk to a favicon. -->
	<g>
		<rect x="0" y="8" width="104" height="104" rx="28" fill="url(#markGradient)"/>
		<rect class="knob" x="24" y="46" width="56" height="28" rx="14"/>
		<circle cx="66" cy="60" r="9" fill="url(#markGradient)"/>
	</g>

	<text class="word" x="128" y="80">
		<tspan class="outer">doCK</tspan><tspan
		       class="inner">ontrol</tspan><tspan
		       class="outer">er</tspan>
	</text>
</svg>
