# Build the image and publish it to the GitHub Container Registry.
#
# What comes out: ghcr.io/mkrage/dockontroler, a multi-arch manifest covering
# linux/amd64 and linux/arm64. Tagged :latest on every push to main, plus the
# short commit SHA, plus proper version tags when you push a v* tag.
#
# This does not replace rebuild.sh. That one still exists for building on the
# host you are about to deploy on; this one is for pulling a finished image
# instead of building it there. Point the compose file at
# ghcr.io/mkrage/dockontroler:latest and Portainer's "Pull latest image" can be
# on again.
name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Pull requests get the tests and a build, but nothing is pushed: a fork's
  # token has no write access to the registry, and an unreviewed branch has no
  # business overwriting :latest.
  pull_request:
  workflow_dispatch:

env:
  # ghcr.io wants a lowercase path. This repository already is one, so it is
  # spelled out rather than lowercased at runtime.
  IMAGE: ghcr.io/mkrage/dockontroler

# One run per branch. A second push to main while the first is still building
# would race to overwrite :latest, and the older one losing is the wrong way
# round.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The same script you run by hand: gofmt, vet, and the suite with the race
      # detector. It runs the toolchain in a container, so there is no Go to set
      # up here — and CI checking something other than what test.sh checks is
      # exactly the drift worth avoiding.
      - name: Formatting, vet and tests
        run: ./test.sh

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # What lets GITHUB_TOKEN push to ghcr.io. Nothing else is needed: no PAT,
      # no repository secret.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # git describe needs the tags, and the default shallow clone has none.
          fetch-depth: 0

      # Same string rebuild.sh computes, and it ends up in the same place: the
      # first log line of the running container.
      - name: Determine version
        id: version
        run: echo "version=$(git describe --tags --always --dirty)" >>"$GITHUB_OUTPUT"

      # buildx, for the two-platform manifest. No setup-qemu-action here on
      # purpose: the Dockerfile's build stage pins itself to $BUILDPLATFORM and
      # cross-compiles, so both architectures are built natively on the runner.
      # Emulating arm64 would be minutes instead of seconds.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        # Skipped for pull requests, which do not push.
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=docKontroler
            org.opencontainers.image.description=A small web UI for the containers on one Docker host

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          build-args: VERSION=${{ steps.version.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Ties the package to this repository, so it shows up on the repo page
          # and inherits its access.
          annotations: ${{ steps.meta.outputs.annotations }}
          # The Go build cache, kept between runs. Without it every run
          # recompiles the standard library twice, once per architecture.
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Provenance attestations are pushed as extra manifest entries, which
          # the package page then lists as "unknown/unknown" platforms next to
          # the two real ones. Not worth the confusion for a tool like this.
          provenance: false
