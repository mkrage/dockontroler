# CodeQL static analysis for the Go code.
#
# Different question from the scanners in build.yml and vulnerability-scan.yml.
# Those ask "is anything we depend on known to be broken"; this one asks "is
# what we wrote broken" — the injection, path-traversal and unsafe-command
# patterns that no advisory database will ever have heard of. For a tool whose
# whole purpose is reaching the Docker socket on behalf of a web request, that
# is the more interesting question of the two.
#
# Results land in Security > Code Scanning. On a pull request they also show up
# as inline annotations on the diff.
name: codeql

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    # Mondays, a little after the dependency scan so the two are not competing
    # for a runner. The weekly run matters because CodeQL's query packs are
    # updated independently of this repository: a query added next month can
    # find something in code that has not been touched since.
    - cron: "41 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze Go
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The one write scope, and it reaches nothing but the code scanning API.
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: go

      # Go needs a real build for CodeQL to have anything to analyse. autobuild
      # finds the module and runs the equivalent of `go build ./...`, which is
      # all this repository needs — there is no generate step and no vendor
      # directory to prepare.
      - name: Autobuild
        uses: github/codeql-action/autobuild@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:go
